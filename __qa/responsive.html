<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KingVision preview checks</title><style>*{box-sizing:border-box}body{margin:0;background:#202326;color:#fff;font:14px monospace}header{padding:12px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}select,button{padding:8px;font:inherit}#stage{overflow:hidden}iframe{border:0;transform-origin:top left;background:#08090c}pre{height:100px;overflow:auto;white-space:pre-wrap;padding:12px;color:#65e5dd;margin:0;font-size:12px}</style><header><label>Viewport <select id="width"><option>375</option><option>430</option><option>1280</option><option selected>1440</option><option>1920</option></select></label><label>Channel <select id="channel"><option>signal</option><option>archive</option><option>access</option></select></label><button id="check">Check layout</button><span>Actual iframe viewport; scaled only to fit this review screen.</span></header><pre id="report">Loading…</pre><div id="stage"><iframe title="KingVision rendered preview" src="/" height="1100"></iframe></div><script>
const frame=document.querySelector('iframe'), width=document.querySelector('#width'), channel=document.querySelector('#channel'), report=document.querySelector('#report');
function resize(){const size=Number(width.value);const scale=Math.min(1,innerWidth/size);frame.style.width=size+'px';frame.style.transform='scale('+scale+')';document.querySelector('#stage').style.height=(1100*scale)+'px';}
function check(){const doc=frame.contentDocument, win=frame.contentWindow;const visible=el=>el.getClientRects().length>0;const images=[...doc.images].filter(visible);const nav=doc.querySelector('.primary-nav');const heading=doc.querySelector('.panel:not([hidden]) h1');report.textContent=JSON.stringify({viewport:win.innerWidth,channel:channel.value,stylesheet:win.getComputedStyle(nav).display,overflow:doc.documentElement.scrollWidth>win.innerWidth,visibleImages:images.map(i=>({src:i.getAttribute('src'),loaded:i.complete&&i.naturalWidth>0})),heading:{fontSize:win.getComputedStyle(heading).fontSize,withinViewport:heading.getBoundingClientRect().right<=win.innerWidth},activeChannels:doc.querySelectorAll('[aria-current="page"]').length},null,1);}
function change(){resize();frame.src='/#'+channel.value;}
width.addEventListener('change',()=>{resize();check()});channel.addEventListener('change',change);document.querySelector('#check').addEventListener('click',check);frame.addEventListener('load',()=>{resize();setTimeout(check,1500)});window.addEventListener('resize',resize);resize();
</script></html>
